<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1214">
<title>Drive Deck</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Layout: one column of big touch targets up top; YouTube player parked a full screen below */
:root{
  --bg:#0f1214; --panel:#1a1f22; --line:#2a3135; --fg:#eef2f3; --muted:#8a979d;
  --accent:#f2b234; --danger:#e5484d; --ok:#3fb27f;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:max(12px,env(safe-area-inset-top,0px)) 12px}
.deck{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.now{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:14px;align-items:center}
.now .text{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.art{width:104px;height:104px;flex:none;border-radius:10px;background:var(--line);object-fit:cover}
.art[src=""]{visibility:hidden}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#title{font-size:20px;font-weight:650;line-height:1.25;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
#meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.controls button{height:88px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.controls button:active{transform:scale(.97)}
#play{background:var(--accent);border-color:var(--accent);color:#141414}
.controls svg{width:40px;height:40px;fill:currentColor}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center}
select,input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:16px;padding:0 12px}
.small{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
.small.on{border-color:var(--accent);color:var(--accent)}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
summary{cursor:pointer;padding:12px 0;font-weight:600}
.manage{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{background:none;border:0;color:var(--danger);font:inherit;cursor:pointer;padding:6px}
#status{font-size:13px;color:var(--muted);min-height:1.2em}
#status.err{color:var(--danger)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
/* Player sits one full screen below the controls so it is out of view in split screen */
.parking{margin-top:calc(100vh + 200px);display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-bottom:40px}
#player{width:200px;height:200px}
</style>
</head>
<body>
<main class="deck">
  <section class="now" aria-live="polite">
    <img class="art" id="art" src="" alt="">
    <div class="text">
      <div class="label">Now playing</div>
      <div id="title">Add a playlist to start</div>
      <div id="meta">–</div>
    </div>
  </section>

  <div class="controls">
    <button id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
    <button id="play" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>

  <div class="row">
    <select id="pick" aria-label="Choose playlist"></select>
    <button class="small" id="shuffle" aria-pressed="false">Shuffle</button>
  </div>

  <div id="status"></div>

  <details id="manageBox">
    <summary>Playlists</summary>
    <div class="manage">
      <input id="newName" placeholder="Name, e.g. Morning drive" autocomplete="off">
      <input id="newLink" placeholder="Paste YouTube playlist or video link" autocomplete="off" inputmode="url">
      <button class="small" id="add">Add</button>
      <div class="list" id="list"></div>
      <p class="hint">Playlists must be Public or Unlisted. Private playlists, and videos whose owners block embedding, will not play here.</p>
    </div>
  </details>
</main>

<section class="parking">
  <div class="label">Player (kept off screen while driving)</div>
  <div id="player"></div>
</section>

<script>
const $ = id => document.getElementById(id);
const KEY = 'drivedeck.playlists';
let artId = null, playlists = [], player, ready = false, playing = false, shuffle = false, currentId = null;

function load(){ try{ playlists = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ playlists = []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(playlists)); }catch(e){} }
function status(msg, err){ $('status').textContent = msg || ''; $('status').className = err ? 'err' : ''; }

function parseLink(url){
  url = url.trim();
  const list = url.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (list) return { type:'list', id:list[1] };
  const vid = url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/);
  if (vid) return { type:'video', id:vid[1] };
  if (/^PL[A-Za-z0-9_-]{10,}$/.test(url)) return { type:'list', id:url };
  return null;
}

function render(){
  const pick = $('pick');
  pick.innerHTML = '';
  if (!playlists.length){
    pick.innerHTML = '<option value="">No playlists yet</option>';
    $('manageBox').open = true;
  }
  playlists.forEach((p,i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = p.name;
    pick.appendChild(o);
  });
  const list = $('list'); list.innerHTML = '';
  playlists.forEach((p,i) => {
    const d = document.createElement('div'); d.className = 'item';
    const s = document.createElement('span'); s.textContent = p.name + (p.type === 'video' ? ' (video)' : '');
    const b = document.createElement('button'); b.textContent = 'Remove';
    b.onclick = () => { playlists.splice(i,1); save(); render(); };
    d.append(s,b); list.appendChild(d);
  });
}

$('add').onclick = () => {
  const parsed = parseLink($('newLink').value);
  if (!parsed){ status('That link does not look like a YouTube playlist or video. Copy it from the Share button in YouTube.', true); return; }
  const name = $('newName').value.trim() || (parsed.type === 'list' ? 'Playlist ' : 'Video ') + (playlists.length + 1);
  playlists.push({ name, ...parsed }); save(); render();
  $('pick').value = playlists.length - 1;
  $('newName').value = ''; $('newLink').value = '';
  status('Added ' + name + '. Tap play to start.');
};

$('pick').onchange = () => { currentId = null; if (playing) startSelected(); };

$('shuffle').onclick = () => {
  shuffle = !shuffle;
  $('shuffle').classList.toggle('on', shuffle);
  $('shuffle').setAttribute('aria-pressed', shuffle);
  if (ready) player.setShuffle(shuffle);
};

/* YouTube player */
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    width: 200, height: 200,
    playerVars: { playsinline: 1, rel: 0, origin: location.origin },
    events: {
      onReady: () => { ready = true; status(''); },
      onStateChange: onState,
      onError: e => {
        const msg = { 2:'Bad link', 5:'Player error', 100:'Video removed or private', 101:'Owner blocks embedding', 150:'Owner blocks embedding' }[e.data] || 'Playback error';
        status(msg + '. Skipping.', true);
        setTimeout(() => { try{ player.nextVideo(); }catch(_){} }, 1200);
      }
    }
  });
};

function onState(e){
  playing = e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING;
  $('playIcon').innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  if (e.data === YT.PlayerState.PLAYING) status('');
  updateNow();
  syncSession();
}

function updateNow(){
  if (!ready) return;
  const d = player.getVideoData ? player.getVideoData() : null;
  if (d && d.title) $('title').textContent = d.title;
  if (d && d.video_id && d.video_id !== artId){
    artId = d.video_id;
    $('art').src = 'https://i.ytimg.com/vi/' + artId + '/mqdefault.jpg';
    syncSession();
  }
  const list = player.getPlaylist && player.getPlaylist();
  const idx = player.getPlaylistIndex && player.getPlaylistIndex();
  const p = playlists[$('pick').value];
  $('meta').textContent = (p ? p.name : '') + (list && list.length ? ' · ' + (idx + 1) + ' of ' + list.length : '');
}
setInterval(updateNow, 3000);

function startSelected(){
  const p = playlists[$('pick').value];
  if (!p){ status('Add a playlist first.', true); $('manageBox').open = true; return; }
  currentId = p.id;
  if (p.type === 'list'){
    player.loadPlaylist({ list: p.id, listType: 'playlist', index: 0 });
    setTimeout(() => { player.setShuffle(shuffle); player.setLoop(true); }, 800);
  } else {
    player.loadVideoById(p.id);
  }
}

function togglePlay(){
  if (!ready){ status('Player still loading…'); return; }
  keepAwake(); startSilent();
  const p = playlists[$('pick').value];
  if (!currentId || (p && p.id !== currentId)) return startSelected();
  playing ? player.pauseVideo() : player.playVideo();
}
function next(){ if (ready) player.nextVideo(); }
function prev(){
  if (!ready) return;
  player.getCurrentTime() > 5 ? player.seekTo(0, true) : player.previousVideo();
}
$('play').onclick = togglePlay;
$('next').onclick = next;
$('prev').onclick = prev;

/* Keep the screen on while playing */
let lock = null;
async function keepAwake(){
  try{ if ('wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && playing) keepAwake(); });

/* Car / Bluetooth buttons: a silent audio loop lets this page own the phone's media controls */
let silent = null;
function startSilent(){
  if (silent) return;
  const rate = 8000, secs = 2, n = rate * secs, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c,i) => v.setUint8(o+i, c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4, 36+n, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  w(36,'data'); v.setUint32(40,n,true); for (let i=0;i<n;i++) v.setUint8(44+i,128);
  silent = new Audio(URL.createObjectURL(new Blob([buf], {type:'audio/wav'})));
  silent.loop = true; silent.volume = 0.01;
  silent.play().catch(() => {});
  if ('mediaSession' in navigator){
    const ms = navigator.mediaSession;
    ms.setActionHandler('play', () => { player.playVideo(); silent.play().catch(()=>{}); });
    ms.setActionHandler('pause', () => player.pauseVideo());
    ms.setActionHandler('nexttrack', next);
    ms.setActionHandler('previoustrack', prev);
  }
}
function syncSession(){
  if (!('mediaSession' in navigator) || !ready) return;
  const d = player.getVideoData ? player.getVideoData() : {};
  try{
    const art = d.video_id ? [{ src: 'https://i.ytimg.com/vi/' + d.video_id + '/hqdefault.jpg', sizes: '480x360', type: 'image/jpeg' }] : [];
    navigator.mediaSession.metadata = new MediaMetadata({ title: d.title || 'Drive Deck', artist: d.author || '', artwork: art });
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  }catch(e){}
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

load(); render();
status('Loading player…');
</script>
</body>
</html>
